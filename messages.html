<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpDate - Mesajlar</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0b0914;
            color: white;
            min-height: 100vh;
            padding: 30px 20px 100px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: ""; position: fixed;
            width: 700px; height: 700px; top: -200px; right: -200px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff416c 0%, transparent 70%);
            filter: blur(100px); opacity: 0.12; z-index: -1;
        }
        body::after {
            content: ""; position: fixed;
            width: 500px; height: 500px; bottom: -100px; left: -100px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff4b2b 0%, transparent 70%);
            filter: blur(120px); opacity: 0.1; z-index: -1;
        }

        .page-wrapper { max-width: 900px; margin: 0 auto; }

        /* HEADER */
        .page-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 28px;
        }
        .page-title {
            font-size: 28px; font-weight: 800;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .match-pill {
            background: rgba(255,65,108,0.12);
            border: 1px solid rgba(255,65,108,0.25);
            color: #ff9999; padding: 6px 18px; border-radius: 50px;
            font-size: 13px; font-weight: 700;
        }

        /* ARAMA KUTUSU */
        .search-box {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px; padding: 10px 18px;
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 20px; transition: 0.2s;
        }
        .search-box:focus-within { border-color: rgba(255,65,108,0.4); }
        .search-box input {
            background: transparent; border: none; outline: none;
            color: white; font-family: inherit; font-size: 14px; flex: 1;
        }
        .search-box input::placeholder { color: #555; }

        /* KONUŞMA KARTI */
        .chat-card {
            display: flex; align-items: center; gap: 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px; padding: 16px 20px;
            text-decoration: none; color: white;
            margin-bottom: 10px; transition: all 0.25s ease;
            position: relative; overflow: hidden;
            backdrop-filter: blur(10px);
        }
        .chat-card::before {
            content: ""; position: absolute;
            top: 0; left: 0; width: 3px; height: 100%;
            background: linear-gradient(to bottom, #ff416c, #ff4b2b);
            opacity: 0; transition: 0.25s;
        }
        .chat-card:hover { transform: translateX(4px) scale(1.005); background: rgba(255,255,255,0.055); border-color: rgba(255,65,108,0.2); }
        .chat-card:hover::before { opacity: 1; }
        .chat-card.has-unread { border-color: rgba(255,65,108,0.25); background: rgba(255,65,108,0.04); }
        .chat-card.has-unread::before { opacity: 0.7; }

        /* Avatar */
        .avatar-wrap { position: relative; flex-shrink: 0; }
        .avatar-img {
            width: 58px; height: 58px; border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(255,65,108,0.4);
            box-shadow: 0 0 14px rgba(255,65,108,0.15);
        }
        .avatar-ph {
            width: 58px; height: 58px; border-radius: 50%;
            background: rgba(255,65,108,0.15);
            border: 2px solid rgba(255,65,108,0.35);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: 900; color: #ff416c;
        }
        .online-dot {
            position: absolute; bottom: 2px; right: 2px;
            width: 12px; height: 12px; background: #4ade80;
            border: 2px solid #0b0914; border-radius: 50%;
        }

        /* Bilgiler */
        .chat-info { flex: 1; min-width: 0; }
        .chat-name-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .chat-name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .chat-name.unread { color: #ffaaaa; }
        .chat-time { font-size: 10px; color: #555; flex-shrink: 0; }
        .chat-preview { font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-preview.unread { color: #ff9999; font-weight: 600; }

        /* Okunmamış badge */
        .unread-badge {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white; min-width: 22px; height: 22px; border-radius: 11px;
            font-size: 11px; font-weight: 800;
            display: flex; align-items: center; justify-content: center;
            padding: 0 6px; flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(255,65,108,0.35);
        }

        /* Boş durum */
        .empty-state {
            text-align: center; padding: 80px 20px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 28px; margin-top: 20px;
        }
        .empty-icon { font-size: 56px; margin-bottom: 16px; }
        .empty-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .empty-sub { font-size: 13px; color: #555; margin-bottom: 20px; }
        .empty-btn {
            display: inline-block; background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white; padding: 10px 24px; border-radius: 50px;
            text-decoration: none; font-size: 13px; font-weight: 700;
            transition: 0.2s;
        }
        .empty-btn:hover { transform: scale(1.04); }

        /* Skeleton yükleme */
        .skeleton-card {
            display: flex; align-items: center; gap: 16px;
            padding: 16px 20px; border-radius: 24px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 10px;
        }
        .skel {
            background: rgba(255,255,255,0.06);
            border-radius: 8px;
            animation: skelShimmer 1.5s ease-in-out infinite;
        }
        @keyframes skelShimmer {
            0%,100% { opacity: 0.4; }
            50% { opacity: 0.7; }
        }

        /* NAVBAR */
        .navbar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(8,6,18,0.97);
            border-top: 1px solid rgba(255,255,255,0.07);
            display: flex; justify-content: space-around;
            padding: 14px 0; backdrop-filter: blur(20px); z-index: 100;
        }
        .nav-link { color: #444; text-decoration: none; font-size: 11px; font-weight: 600; text-align: center; transition: 0.2s; }
        .nav-link:hover, .nav-link.active { color: #ff4b4b; }
        .nav-icon { display: block; font-size: 22px; margin-bottom: 3px; }
    </style>
</head>
<body>
<div class="page-wrapper">
    <div class="page-header">
        <h1 class="page-title">💬 Mesajlar</h1>
        <div class="match-pill" id="matchPill">Yükleniyor...</div>
    </div>

    <div class="search-box">
        <span style="font-size:16px;color:#555;">🔍</span>
        <input type="text" id="searchInp" placeholder="İsme göre ara..." oninput="filterChats(this.value)">
    </div>

    <div id="chatList">
        <!-- Skeleton -->
        <div class="skeleton-card">
            <div class="skel" style="width:58px;height:58px;border-radius:50%;flex-shrink:0"></div>
            <div style="flex:1;display:flex;flex-direction:column;gap:8px">
                <div class="skel" style="height:13px;width:45%;border-radius:6px"></div>
                <div class="skel" style="height:11px;width:80%;border-radius:6px"></div>
            </div>
        </div>
        <div class="skeleton-card">
            <div class="skel" style="width:58px;height:58px;border-radius:50%;flex-shrink:0"></div>
            <div style="flex:1;display:flex;flex-direction:column;gap:8px">
                <div class="skel" style="height:13px;width:55%;border-radius:6px"></div>
                <div class="skel" style="height:11px;width:70%;border-radius:6px"></div>
            </div>
        </div>
        <div class="skeleton-card">
            <div class="skel" style="width:58px;height:58px;border-radius:50%;flex-shrink:0"></div>
            <div style="flex:1;display:flex;flex-direction:column;gap:8px">
                <div class="skel" style="height:13px;width:40%;border-radius:6px"></div>
                <div class="skel" style="height:11px;width:90%;border-radius:6px"></div>
            </div>
        </div>
    </div>
</div>

<nav class="navbar">
    <a href="index.html" class="nav-link"><span class="nav-icon">🔥</span>Keşfet</a>
    <a href="messages.html" class="nav-link active"><span class="nav-icon">💬</span>Mesajlar</a>
    <a href="profile.html" class="nav-link"><span class="nav-icon">👤</span>Profil</a>
</nav>

<script>
    const benimID = localStorage.getItem('loggedInUserId');
    if (!benimID) window.location.href = 'login.html';

    const BASE = 'http://localhost:5005';
    let allChats = [];

    async function getConvInfo(kisiId) {
        try {
            const res = await fetch(`${BASE}/api/messages/${benimID}/${kisiId}`);
            if (!res.ok) return { preview: 'İlk mesajı sen at! ✨', unread: 0, time: '' };
            const msgs = await res.json();
            if (!Array.isArray(msgs) || msgs.length === 0) return { preview: 'İlk mesajı sen at! ✨', unread: 0, time: '' };
            const last = msgs[msgs.length - 1];
            const unread = msgs.filter(m => m.sender_id != benimID && !m.is_read).length;
            const d = new Date(last.created_at);
            const now = new Date();
            let time = d.toDateString() === now.toDateString()
                ? d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })
                : d.toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit' });
            let preview = '';
            if (last.audio_url) preview = '🎙️ Sesli mesaj';
            else if (last.image_url) preview = '🖼️ Fotoğraf';
            else preview = (last.message || '').length > 48 ? last.message.slice(0,48) + '…' : last.message || '—';
            return { preview, unread, time };
        } catch(e) { return { preview: '—', unread: 0, time: '' }; }
    }

    function buildCard(kisi) {
        const picUrl = kisi.profile_pic ? `${BASE}${kisi.profile_pic}` : null;
        const init = (kisi.full_name || '?')[0].toUpperCase();
        const avatarHTML = picUrl
            ? `<img class="avatar-img" src="${picUrl}" alt="${kisi.full_name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
               <div class="avatar-ph" style="display:none">${init}</div>`
            : `<div class="avatar-ph">${init}</div>`;
        const unreadBadge = kisi.unread > 0
            ? `<div class="unread-badge">${kisi.unread > 9 ? '9+' : kisi.unread}</div>` : '';
        return `
        <a href="chat.html?id=${kisi.id}" class="chat-card${kisi.unread > 0 ? ' has-unread' : ''}">
            <div class="avatar-wrap">
                ${avatarHTML}
                <div class="online-dot"></div>
            </div>
            <div class="chat-info">
                <div class="chat-name-row">
                    <div class="chat-name${kisi.unread > 0 ? ' unread' : ''}">${kisi.full_name}</div>
                    <div class="chat-time">${kisi.time}</div>
                </div>
                <div class="chat-preview${kisi.unread > 0 ? ' unread' : ''}">${kisi.preview}</div>
            </div>
            ${unreadBadge}
        </a>`;
    }

    function filterChats(query) {
        const q = query.toLowerCase().trim();
        const filtered = q ? allChats.filter(k => k.full_name.toLowerCase().includes(q)) : allChats;
        document.getElementById('chatList').innerHTML = filtered.length
            ? filtered.map(buildCard).join('')
            : '<p style="text-align:center;color:#555;padding:40px 0;font-size:14px;">Sonuç bulunamadı</p>';
    }

    async function load() {
        try {
            const res = await fetch(`${BASE}/api/matches/${benimID}`);
            if (!res.ok) throw new Error();
            const matches = await res.json();
            document.getElementById('matchPill').textContent = `${matches.length} Eşleşme`;

            if (!matches.length) {
                document.getElementById('chatList').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">💌</div>
                        <div class="empty-title">Henüz mesajın yok</div>
                        <p class="empty-sub">Keşfette birilerini beğen ve eşleş!</p>
                        <a href="index.html" class="empty-btn">🔥 Keşfete Git</a>
                    </div>`;
                return;
            }

            const withInfo = await Promise.all(matches.map(async k => ({ ...k, ...(await getConvInfo(k.id)) })));
            withInfo.sort((a, b) => (b.unread || 0) - (a.unread || 0));
            allChats = withInfo;
            document.getElementById('chatList').innerHTML = allChats.map(buildCard).join('');
        } catch(e) {
            document.getElementById('chatList').innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">😵</div>
                    <div class="empty-title">Bağlantı hatası</div>
                    <p class="empty-sub">Sunucu çalışıyor mu kontrol et</p>
                </div>`;
        }
    }

    load();
    setInterval(load, 8000);
</script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="global-call.js"></script>
</body>
</html>
